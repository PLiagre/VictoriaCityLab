name: pipeline-audit-retired

# ADR-0002 : Cursor exécute dans agent/* ; Claude relit dans une invocation
# distincte. Plus d'audit GitHub auto-fusionné, plus de pull_request vers
# un runner personnel.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "pipeline-audit retiré (ADR-0002) ; revue Claude hors fusion automatique."

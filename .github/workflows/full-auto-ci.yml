name: full-auto-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Harness and architecture tests
        run: py -m unittest discover -s harness/tests -v
      - name: Unity worker red/green
        run: py -m unittest Tools.tests.test_unity_windows_worker -v
      - name: Roadmap contract
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File Tools/check_roadmap.ps1
      - name: Audit ledger
        run: py harness/audit_ledger.py Architecture/audit-ledger.jsonl --validate
      - name: Whitespace gate
        run: git diff --check


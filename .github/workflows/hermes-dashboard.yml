name: hermes-dashboard

# Vue propriétaire. workflow_dispatch seulement ; aucune fusion.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citylab-hermes-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Render owner dashboard
        run: python3 hermes/dashboard.py
      - name: Upload dashboard without merging
        uses: actions/upload-artifact@v4
        with:
          name: hermes-dashboard
          path: hermes/DASHBOARD.md
      - name: Show whether the committed view drifted
        run: |
          if git diff --quiet -- hermes/DASHBOARD.md; then
            echo "Vue déjà à jour."
          else
            echo "La vue calculée diffère du fichier commis."
            echo "Hermes ou le propriétaire peut la commettre ; ce job ne fusionne pas."
            git diff -- hermes/DASHBOARD.md
          fi
